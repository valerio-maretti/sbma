[build-system]
requires = ["setuptools>=69", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "sbma"
version = "1.0.1"
description = "Score Based Multiple Assignment Solver"
authors = [
  {name = "Valerio Maretti", email = "valerio.maretti@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
]

[tool.setuptools]
packages = ["sbma"]
package-dir = {"" = "src"}

# --- PYTEST CONFIGURATION ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v --strict-markers"

# --- RUFF CONFIGURATION ---
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F = Flake8, I = isort, PL = Pylint, D = pydocstyle
select = ["F", "I"]
ignore = [
    "F403", # May be undefined, or defined from star imports
    "F405", # Import * used; unable to detect undefined names
]
