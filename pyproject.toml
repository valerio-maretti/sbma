# pyproject.toml
[build-system]
requires = ["setuptools>=45", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "sbma"
version = "1.0.0"
description = "Score Based Multiple Assignment Solver"
authors = [
  {name = "Valerio Maretti", email = "valerio.maretti@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
dependencies = [
    "numpy",
]

[tool.setuptools]
packages = ["sbma"]
package-dir = {"" = "src"}
