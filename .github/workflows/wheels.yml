name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # manylinux/musllinux x86_64
          - ubuntu-24.04-arm    # manylinux/musllinux aarch64
          - windows-latest      # win_amd64
          - macos-15-intel      # macosx_x86_64 (macos-13 was retired, macos-14 is deprecated)
          - macos-15            # macosx_arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.23.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test_oldest_numpy:
    name: Oldest supported NumPy
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse

      # The wheels are compiled against NumPy 2.x headers but target the 1.22
      # C-API (NPY_TARGET_VERSION in setup.py). This asserts that floor really
      # holds, so a future rebuild cannot raise it without the build going red.
      - name: Install the wheel against NumPy 1.22
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install "numpy==1.22.*"
          python -m pip install --no-deps --no-index --find-links wheelhouse sbma
          python -c "import numpy, sbma._solver; print('numpy', numpy.__version__, '- extension imported')"

      - name: Run the solver suite
        run: pytest tests/test_solver.py

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check that the sdist compiles from a clean tree
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.tar.gz
          cd "$(mktemp -d)" && pytest "$GITHUB_WORKSPACE/tests/test_solver.py"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, test_oldest_numpy, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
